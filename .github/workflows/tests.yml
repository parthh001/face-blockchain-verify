name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # cmake/build-essential are needed to compile dlib for face_recognition.
      # This is also the first place the dlib backend actually gets tested end
      # to end -- the sandbox this project was built in had no PyPI access, so
      # only the OpenCV/HOG fallback backend could be verified there.
      - name: Install system dependencies (for dlib)
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v
